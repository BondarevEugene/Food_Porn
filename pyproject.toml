[project]
name = "food-porn-bot"
version = "0.1.0"
description = "Telegram bot that creates multilingual A3 food-menu booklets"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.22,<4",
  "SQLAlchemy[asyncio]>=2.0.43,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.16,<2",
  "pydantic-settings>=2.10,<3",
  "openai>=1.100,<3",
  "Pillow>=11.3,<13",
  "reportlab>=4.4,<5",
  "aiofiles>=24.1,<25",
  "phonenumbers>=9.0,<10",
  "greenlet>=3.2,<4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
