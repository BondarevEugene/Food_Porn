name: Quality checks

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql+asyncpg://food_porn:food_porn@localhost:5432/food_porn_ci
      FOOD_PORN_TEST_DATABASE_URL: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio ruff aiosqlite

      - name: Ruff
        run: python -m ruff check app src tests alembic main.py

      - name: Compile Python sources
        run: python -m compileall -q app src tests alembic

      - name: Check Alembic revision graph without connecting to database
        run: |
          python -m alembic heads
          python -m alembic history

      - name: Run isolated unit tests
        run: python -m pytest -q --tb=short -rs

  postgres-gift-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: food_porn
          POSTGRES_PASSWORD: food_porn
          POSTGRES_DB: food_porn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U food_porn -d food_porn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FOOD_PORN_TEST_DATABASE_URL: postgresql+asyncpg://food_porn:food_porn@127.0.0.1:5432/food_porn_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio aiosqlite

      - name: Verify dedicated local test database
        run: |
          python -c "import os; from sqlalchemy.engine import make_url; u=make_url(os.environ['FOOD_PORN_TEST_DATABASE_URL']); assert u.database == 'food_porn_test' and u.host == '127.0.0.1'"

      - name: Run real PostgreSQL gift payment concurrency tests
        run: python -m pytest -q tests/test_gift_postgres_integration.py --tb=short -rs

  migration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: food_porn
          POSTGRES_PASSWORD: food_porn
          POSTGRES_DB: food_porn_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U food_porn -d food_porn_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://food_porn:food_porn@127.0.0.1:5432/food_porn_ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify isolated database target
        run: |
          python -c "import os; from sqlalchemy.engine import make_url; u=make_url(os.environ['DATABASE_URL']); assert u.database == 'food_porn_ci' and u.host == '127.0.0.1', 'Unsafe database target'"

      - name: Upgrade empty PostgreSQL database to Alembic head
        run: python -m alembic upgrade head

      - name: Verify final revision
        run: |
          python -m alembic current
          python -c "from alembic.config import Config; from alembic.script import ScriptDirectory; s=ScriptDirectory.from_config(Config('alembic.ini')); assert len(s.get_heads()) == 1, 'Multiple Alembic heads'"
