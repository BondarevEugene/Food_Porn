name: Quality checks

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql+asyncpg://food_porn:food_porn@localhost:5432/food_porn_ci
      FOOD_PORN_TEST_DATABASE_URL: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio ruff aiosqlite

      - name: Ruff
        run: python -m ruff check app src tests alembic main.py

      - name: Compile Python sources
        run: python -m compileall -q app src tests alembic

      - name: Check Alembic revision graph without connecting to database
        run: |
          python -m alembic heads
          python -m alembic history

      - name: Run isolated unit tests
        run: python -m pytest -q --tb=short -rs
