services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: food_porn
      POSTGRES_USER: food_porn
      POSTGRES_PASSWORD: food_porn
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U food_porn"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped

volumes:
  postgres_data:

